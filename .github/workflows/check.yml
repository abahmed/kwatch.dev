name: Check website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: website-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Build and verify documentation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out website
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Check out Kwatch source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: abahmed/kwatch
          path: kwatch
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Verify generated reference
        env:
          KWATCH_SOURCE: ${{ github.workspace }}/kwatch
        run: yarn docs:verify

      - name: Verify generated files are committed
        run: git diff --exit-code -- apps/docs/docs/reference/generated

      - name: Check shell syntax
        run: bash -n apps/web/public/kwatch.sh apps/docs/tests/*.sh

      - name: Check whitespace
        run: git diff --check

      - name: Run installer tests
        run: yarn test:manager

      - name: Typecheck
        run: yarn typecheck

      - name: Build website
        run: yarn build:docs

      - name: Verify SEO metadata and sitemap coverage
        run: yarn seo:verify

  app:
    name: Check app.kwatch.dev
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out website
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Typecheck app
        run: yarn typecheck:app

      - name: Lint app
        run: yarn lint:app

      - name: Test app
        run: yarn test:app

      - name: Build app
        run: yarn build:app

  web:
    name: Build and check marketing site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out website
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Type and template check
        run: yarn typecheck:web

      - name: Build marketing site
        run: yarn build:web

      - name: Check installer and charts are published
        run: |
          test -s apps/web/dist/kwatch.sh
          test -s apps/web/dist/charts/index.yaml
          test -s apps/web/dist/_redirects
          test -s apps/web/dist/_headers

      - name: Check redirects and sitemap
        run: yarn seo:verify:web
